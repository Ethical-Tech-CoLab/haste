<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Interactive Labeler — Azure Maps debug (app backend)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="https://atlas.microsoft.com/sdk/javascript/mapcontrol/3/atlas.min.css" />
  <script src="https://atlas.microsoft.com/sdk/javascript/mapcontrol/3/atlas.min.js"></script>
  <script src="https://unpkg.com/pmtiles@3.2.0/dist/pmtiles.js"></script>
  <style>
    html, body { margin: 0; padding: 0; height: 100%; font-family: sans-serif; }
    #map { position: absolute; inset: 0; }
    #panel {
      position: absolute; top: 10px; left: 10px; z-index: 5;
      background: rgba(255,255,255,0.96); border-radius: 6px; padding: 10px 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2); max-width: 360px; font-size: 13px;
    }
    #panel h3 { margin: 0 0 6px; font-size: 14px; }
    #panel label { display: block; margin: 3px 0; cursor: pointer; }
    .badge { display: inline-block; width: 10px; height: 10px; border-radius: 50%;
             background: #bbb; margin-right: 6px; vertical-align: middle; }
    .ok { background: #2b9e2b; } .err { background: #cc1100; } .pending { background: #e8a32b; }
    #log {
      position: absolute; bottom: 10px; left: 10px; z-index: 5;
      background: rgba(20,20,20,0.88); color: #d6f5d6; font-family: monospace;
      font-size: 11px; line-height: 1.45; padding: 8px 10px; border-radius: 6px;
      max-width: 60vw; max-height: 38vh; overflow: auto; white-space: pre-wrap;
    }
    #log .e { color: #ff8a80; } #log .w { color: #ffd54f; } #log .i { color: #9fd3ff; }
    #info { position: absolute; bottom: 10px; right: 10px; z-index: 5;
      background: rgba(255,255,255,0.96); border-radius: 6px; padding: 6px 10px;
      font-size: 12px; font-family: monospace; box-shadow: 0 1px 4px rgba(0,0,0,0.2); }
  </style>
</head>
<body>
  <div id="map"></div>

  <div id="panel">
    <h3>Labeler debug — Azure Maps</h3>
    <div style="color:#666;margin-bottom:6px">Azure Maps + PMTiles footprints
      via <code>atlas.addProtocol</code> (range requests).</div>
    <div><span id="b-api" class="badge"></span>API config</div>
    <div><span id="b-osm" class="badge"></span>OSM basemap (TileLayer)</div>
    <div><span id="b-img" class="badge"></span>titiler imagery</div>
    <div><span id="b-fp" class="badge"></span>PMTiles footprints (addProtocol)</div>
    <div><span id="b-fs" class="badge"></span>setFeatureState support</div>
    <hr style="border:none;border-top:1px solid #eee;margin:8px 0" />
    <label><input type="checkbox" id="t-osm" checked /> OSM basemap</label>
    <label><input type="checkbox" id="t-img" checked /> post-event imagery</label>
    <label><input type="checkbox" id="t-fp" checked /> footprints</label>
    <div style="margin-top:6px;color:#666">Click a building to dump its props.</div>
  </div>

  <div id="info">—</div>
  <div id="log"></div>

  <script>
    // ── CONFIG ──────────────────────────────────────────────────────────────
    // Model 3618: DINOv2 ViT-S/14 over Negril, Jamaica — built with the
    // latest tippecanoe flag set (max-zoom=15, --no-tile-size-limit,
    // --no-tiny-polygon-reduction[-at-maximum-zoom],
    // --drop-densest-as-needed). Live signed URLs are fetched from the
    // API so the SAS token stays fresh.
    const API_BASE       = "http://localhost:7071/api";
    const PROJECT_ID     = "4dce7224-d646-4673-bf05-0dd92acc10de";
    const IMAGE_LAYER_ID = "434a19c4-6053-4781-b01b-297ee403ec3d";
    const MODEL_ID       = "3618";
    const BUILDINGS_SOURCE_LAYER = "buildings"; // tippecanoe -l buildings
    // API returns blob URLs on the docker-internal host; rewrite for browser.
    const hostRewrite = (u) => (u || "").replace("azurite:10000", "localhost:10000");
    // Set to a fully-signed override URL to bypass the API lookup (useful when
    // testing a re-tiled archive without re-creating the model). Empty string
    // means "use whatever pmtilesUrl the model record currently advertises".
    const PMTILES_OVERRIDE = "";

    // ── Logging ─────────────────────────────────────────────────────────────
    const logEl = document.getElementById("log");
    function log(msg, cls = "i") {
      const t = new Date().toISOString().substr(11, 12);
      logEl.innerHTML += `<span class="${cls}">[${t}] ${msg}</span>\n`;
      logEl.scrollTop = logEl.scrollHeight;
      console.log("[debug]", msg);
    }
    function badge(id, state) { document.getElementById(id).className = "badge " + state; }
    window.addEventListener("error", (e) => log("window error: " + e.message, "e"));
    window.addEventListener("unhandledrejection", (e) =>
      log("promise rejection: " + (e.reason?.message || e.reason), "e"));

    // ── Azure Maps anonymous auth (mirrors getAzureMapsAuthOptions, local-dev
    //    placeholder mode: resolve a fake JWT so the control still init's). ────
    const FAKE_JWT =
      "eyJhbGciOiJub25lIiwidHlwIjoiSldUIn0." +
      "eyJzdWIiOiJoYXN0ZS1sb2NhbC1kZXYiLCJleHAiOjQxMDI0NDQ4MDB9.";
    const authOptions = {
      authType: "anonymous",
      clientId: "placeholder",
      getToken: (resolve) => resolve(FAKE_JWT),
    };

    const map = new atlas.Map("map", {
      center: [0, 0],
      zoom: 2,
      // "blank" basemap because local dev has no real Azure Maps subscription;
      // OSM is added below as a raster TileLayer (same as the app's pattern).
      style: "blank",
      showLogo: false,
      authOptions,
    });

    map.events.add("error", (e) => log("atlas error: " + (e.error?.message || e.error), "e"));

    const infoEl = document.getElementById("info");
    // Count currently-rendered building features in the viewport, via the
    // internal Mapbox-GL map (atlas.Map has no public querying API). Recalc
    // on every moveend after the buildings layer/source is wired up.
    function countRenderedBuildings() {
      const gl = window.__glMap;
      const layers = window.__bldLayerIds;
      if (!gl || !layers || !layers.length) return null;
      try {
        const feats = gl.queryRenderedFeatures(undefined, { layers });
        // Dedupe by id since a feature can render across tile seams.
        const ids = new Set();
        let withoutId = 0;
        for (const f of feats) {
          if (f.id != null) ids.add(f.id);
          else withoutId++;
        }
        return { unique: ids.size, total: feats.length, withoutId };
      } catch {
        return null;
      }
    }
    function updateInfo(extra) {
      const cam = map.getCamera();
      const c = cam.center || [0, 0];
      const counts = countRenderedBuildings();
      const fpStr = counts
        ? `${counts.unique.toLocaleString()} bldgs` +
          (counts.withoutId ? ` (+${counts.withoutId} no-id)` : "")
        : "";
      infoEl.textContent =
        `z${(cam.zoom || 0).toFixed(2)} | ${c[1].toFixed(5)}, ${c[0].toFixed(5)}` +
        (fpStr ? " | " + fpStr : "") +
        (extra ? " | " + extra : "");
    }
    map.events.add("moveend", () => updateInfo());

    // ── Load everything once the control is ready ─────────────────────────────
    map.events.add("ready", async () => {
      log("atlas control ready (auth ok, blank style).");
      map.setUserInteraction({ dragRotateInteraction: false, pinchRotateInteraction: false });
      map.controls.add(new atlas.control.ZoomControl(), { position: "top-right" });

      // Register the PMTiles protocol (Azure Maps v3 supports addProtocol).
      const protocol = new pmtiles.Protocol();
      atlas.addProtocol("pmtiles", protocol.tile);

      // ── Find the internal GL map (atlas has no public setFeatureState) ─────
      // atlas.Map wraps a Mapbox/MapLibre-GL fork. setFeatureState lives on that
      // internal instance; reach it so we can drive feature-state coloring.
      function findGlMap(atlasMap) {
        const direct = [atlasMap.map, atlasMap._map, atlasMap.gl, atlasMap._gl];
        for (const c of direct)
          if (c && typeof c.setFeatureState === "function") return c;
        for (const k of Object.keys(atlasMap)) {
          const v = atlasMap[k];
          if (v && typeof v === "object" && typeof v.setFeatureState === "function") return v;
        }
        return null;
      }
      const glMap = findGlMap(map);
      window.__glMap = glMap;
      if (glMap) {
        log("found internal GL map with setFeatureState — trying feature-state path.");
        badge("b-fs", "pending");
      } else {
        log("could not reach an internal map with setFeatureState — would need a GeoJSON overlay.", "w");
        badge("b-fs", "err");
      }

      // 1. OSM basemap as a raster TileLayer (bottom-most).
      let osmLayer;
      try {
        osmLayer = new atlas.layer.TileLayer({
          tileUrl: "https://tile.openstreetmap.org/{z}/{x}/{y}.png",
          tileSize: 256, minSourceZoom: 0, maxSourceZoom: 19,
        });
        map.layers.add(osmLayer);
        badge("b-osm", "ok");
        log("OSM TileLayer added.");
      } catch (e) { badge("b-osm", "err"); log("OSM add failed: " + e.message, "e"); }

      // 2. Resolve live URLs from the API.
      let postTileUrl = null, pmtilesUrl = null;
      try {
        badge("b-api", "pending");
        const models = await fetch(
          `${API_BASE}/GetLayerModelsDetails?projectId=${PROJECT_ID}&imageLayerId=${IMAGE_LAYER_ID}`
        ).then((r) => r.json());
        const list = Array.isArray(models) ? models : (models.models || []);
        const pmModel = list.find((m) => String(m.modelId) === MODEL_ID);
        if (!pmModel) throw new Error(`model ${MODEL_ID} not found`);
        pmtilesUrl = PMTILES_OVERRIDE || hostRewrite(pmModel.pmtilesUrl);
        log("pmtilesUrl: " + (PMTILES_OVERRIDE ? "[OVERRIDE w/ feature ids] " : "") + pmtilesUrl);

        const ld = await fetch(
          `${API_BASE}/GetLayerLabelingToolData?projectId=${PROJECT_ID}&imageLayerId=${IMAGE_LAYER_ID}`
        ).then((r) => r.json());
        postTileUrl = (ld.imagery || {}).postEventTileUrl || "";
        log("postEventTileUrl: " + (postTileUrl ? postTileUrl.slice(0, 80) + "…" : "(none)"));
        badge("b-api", "ok");
      } catch (e) { badge("b-api", "err"); log("API config failed: " + e.message, "e"); }

      // 3. titiler post-event imagery (atlas TileLayer — same as loadImagery()).
      let imgLayer;
      if (postTileUrl) {
        try {
          imgLayer = new atlas.layer.TileLayer({ tileUrl: postTileUrl, tileSize: 256 });
          map.layers.add(imgLayer);
          badge("b-img", "ok");
          log("titiler imagery TileLayer added.");
        } catch (e) { badge("b-img", "err"); log("imagery add failed: " + e.message, "e"); }
      } else { badge("b-img", "err"); log("no post-event tile URL.", "w"); }

      // 4. Footprints from PMTiles via atlas.addProtocol + VectorTileSource
      //    (streamed by range requests — only tiles in view are fetched).
      if (pmtilesUrl) {
        badge("b-fp", "pending");
        try {
          // Pre-register the archive so we can read its header for centering.
          const p = new pmtiles.PMTiles(pmtilesUrl);
          protocol.add(p);
          const h = await p.getHeader();
          log(`PMTiles header: center [${h.centerLon?.toFixed(5)}, ${h.centerLat?.toFixed(5)}] z${h.minZoom}-${h.maxZoom}`);
          const meta = await p.getMetadata();
          const vl = (meta.vector_layers || []).map(
            (v) => `${v.id}(${Object.keys(v.fields || {}).length} fields)`
          );
          log("PMTiles vector_layers: " + (vl.join(", ") || "(none)"));

          map.sources.add(
            new atlas.source.VectorTileSource("buildings", {
              type: "vector",
              url: "pmtiles://" + pmtilesUrl,
              // Key feature-state on the building id (if Azure Maps honors it).
              promoteId: { [BUILDINGS_SOURCE_LAYER]: "id" },
            })
          );
          // Fill color is feature-state driven: 'sel' => orange, else blue. If
          // setFeatureState works, clicking a building recolors it (visual proof).
          const fill = new atlas.layer.PolygonLayer(
            "buildings", "buildings-fill",
            {
              sourceLayer: BUILDINGS_SOURCE_LAYER,
              fillColor: [
                "case",
                ["boolean", ["feature-state", "sel"], false], "#ff8c00",
                "#3388ff",
              ],
              fillOpacity: 0.45,
            }
          );
          const line = new atlas.layer.LineLayer(
            "buildings", "buildings-line",
            { sourceLayer: BUILDINGS_SOURCE_LAYER, strokeColor: "#1a5276", strokeWidth: 1 }
          );
          map.layers.add([fill, line]);
          badge("b-fp", "ok");
          log("footprints VectorTileSource (pmtiles://) + layers added.");

          // Discover the source id the internal GL style actually uses (Azure
          // Maps may prefix/rename it), so feature-state targets the right one.
          window.__bldSourceIds = ["buildings"];
          window.__bldLayerIds = [];
          if (glMap && typeof glMap.getStyle === "function") {
            try {
              const style = glMap.getStyle();
              const srcs = Object.keys(style.sources || {});
              log("internal GL style sources: " + srcs.join(", "));
              const matches = srcs.filter((s) => /build/i.test(s));
              window.__bldSourceIds = [...new Set(["buildings", ...matches, ...srcs])];
              // Internal fill layer ids over the building source(s).
              window.__bldLayerIds = (style.layers || [])
                .filter((l) => l.type === "fill" &&
                  (window.__bldSourceIds.includes(l.source) || /build/i.test(l.id)))
                .map((l) => l.id);
              log("internal GL fill layers: " + (window.__bldLayerIds.join(", ") || "(none)"));
            } catch (err) { log("getStyle() failed: " + err.message, "w"); }
          }

          if (h.centerLon || h.centerLat) {
            map.setCamera({
              center: [h.centerLon, h.centerLat],
              zoom: Math.max(15, (h.maxZoom || 16) - 2),
            });
          }

          // Click handler: log props AND exercise setFeatureState (the test).
          map.events.add("click", fill, (e) => {
            const s = e.shapes && e.shapes[0];
            if (!s) return;
            const props = typeof s.getProperties === "function" ? s.getProperties() : s.properties;
            const fKeys = Object.keys(props || {}).filter((k) => /^f_\d+$/.test(k));
            const id = props.id ?? (typeof s.getId === "function" ? s.getId() : undefined);
            log(`clicked id=${id} overture=${props.overture_id} | ${fKeys.length} f_* feats`);

            const gl = window.__glMap;
            if (!gl) { log("no internal GL map — can't setFeatureState.", "w"); return; }

            // Ask the RENDERER what id/source/sourceLayer it uses for this
            // feature — that's the only key feature-state will match on.
            let rf = [];
            try {
              const px = e.pixel || (map.positionsToPixels([e.position])[0]);
              rf = gl.queryRenderedFeatures(px,
                window.__bldLayerIds?.length ? { layers: window.__bldLayerIds } : undefined);
            } catch (err) { log("queryRenderedFeatures failed: " + err.message, "w"); }

            if (!rf.length) { log("renderer returned no feature at click point.", "w"); return; }
            const f = rf[0];
            // f.id is the renderer's feature id; if undefined, promoteId did NOT
            // apply and feature-state can't target this feature.
            log(`renderer feature: id=${f.id} props.id=${f.properties?.id} ` +
                `source="${f.source}" sourceLayer="${f.sourceLayer}"`,
                f.id == null ? "w" : "i");
            if (f.id == null) {
              badge("b-fs", "err");
              log("renderer feature id is undefined → promoteId not applied by atlas. " +
                  "feature-state can't match; use a GeoJSON overlay (or promoteId on the internal source).", "e");
              return;
            }

            const key = { source: f.source, sourceLayer: f.sourceLayer, id: f.id };
            try {
              const cur = gl.getFeatureState(key);
              const next = !(cur && cur.sel);
              gl.setFeatureState(key, { sel: next });
              map.triggerRepaint();
              log(`setFeatureState(sel=${next}) source="${f.source}" id=${f.id} ✓ — ` +
                  "building should now be orange.");
              badge("b-fs", "ok");
            } catch (err) {
              badge("b-fs", "err");
              log("setFeatureState on renderer key threw: " + err.message, "e");
            }
          });
          map.events.add("mouseenter", fill, () => (map.getCanvasContainer().style.cursor = "pointer"));
          map.events.add("mouseleave", fill, () => (map.getCanvasContainer().style.cursor = ""));
        } catch (e) { badge("b-fp", "err"); log("PMTiles footprints load failed: " + e.message, "e"); }
      }

      // ── Toggles ─────────────────────────────────────────────────────────────
      document.getElementById("t-osm").addEventListener("change", (e) =>
        osmLayer && osmLayer.setOptions({ visible: e.target.checked }));
      document.getElementById("t-img").addEventListener("change", (e) =>
        imgLayer && imgLayer.setOptions({ visible: e.target.checked }));
      document.getElementById("t-fp").addEventListener("change", (e) => {
        const v = e.target.checked;
        ["buildings-fill", "buildings-line"].forEach((id) => {
          const l = map.layers.getLayerById(id);
          if (l) l.setOptions({ visible: v });
        });
      });

      // Refresh the bottom-right footprint count as new tiles stream in
      // (sourcedata fires once per finished tile). Coalesced via rAF so
      // a moveend that loads many tiles doesn't re-query on every fire.
      if (glMap) {
        let scheduled = false;
        const refresh = () => {
          if (scheduled) return;
          scheduled = true;
          requestAnimationFrame(() => {
            scheduled = false;
            updateInfo();
          });
        };
        glMap.on("sourcedata", (e) => {
          if (e.isSourceLoaded && /build/i.test(e.sourceId || "")) refresh();
        });
        glMap.on("idle", refresh);
      }

      updateInfo();
    });
  </script>
</body>
</html>
